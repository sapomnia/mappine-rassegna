name: Rassegna settimanale

on:
  schedule:
    # Mercoledì 03:00 UTC = 5:00 Roma in ora legale (CEST), 4:00 in ora solare (CET).
    # Su GH Actions free i cron possono ritardare di ore: l'orario è indicativo.
    - cron: '0 3 * * 3'
  workflow_dispatch:

jobs:
  rassegna:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python rassegna.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: riccardo@mappine.it
